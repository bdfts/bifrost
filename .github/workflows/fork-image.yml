# Builds the Bifrost image this fork actually runs, from LOCAL module sources.
#
# transports/go.mod pins github.com/maximhq/bifrost/core to a published version
# with no replace directive and no go.work, so the upstream Dockerfile would
# compile against upstream's core and silently produce an image WITHOUT the
# ModelArk provider this fork exists for. Dockerfile.local sets up a go
# workspace over ./core and is the only variant that carries our changes.
#
# This workflow lives on deploy/rukav-fork, never on feat/modelark-provider,
# so it stays out of the upstream pull request's diff.
name: Fork Image

on:
  push:
    branches: [deploy/rukav-fork]
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bdfts/bifrost

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: transports/Dockerfile.local
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          # The cluster is x86 throughout; an arm64 leg would only add a slow
          # QEMU build for an image nothing pulls.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE }}:modelark
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the built image carries the ModelArk provider
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}"
          docker pull "$IMG"
          # The binary is /app/main. Assert it exists first -- a wrong path
          # would otherwise make every check below vacuously "fail", which is
          # how this step reported a false negative on its first run.
          docker run --rm --entrypoint sh "$IMG" -c 'test -f /app/main'
          # Match on the provider's own base URL, not just the name: the name
          # alone could plausibly appear in an unrelated string, the host it
          # talks to could not. grep -a, not strings + grep -x -- Go packs
          # string literals into one blob, so no literal sits on its own line.
          for needle in modelark ark.ap-southeast.bytepluses.com; do
            docker run --rm --entrypoint sh "$IMG" -c "grep -aq '$needle' /app/main" \
              || { echo "::error::'$needle' missing from /app/main - the build resolved core from upstream instead of ./core"; exit 1; }
            echo "found: $needle"
          done
